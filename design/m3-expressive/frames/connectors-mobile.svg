<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1712.32" viewBox="0 0 390 1712.32"><title>Kết nối với công cụ bạn dùng</title><desc>Original static design reference, sample data; not runtime screenshot.</desc><rect width="390" height="1712.32" fill="#F0F3F9"/><text x="16" y="19" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="start">EVOBASE · connectors · STATIC DESIGN / SAMPLE DATA</text><rect x="0" y="28" width="390" height="60" rx="0" fill="#FBFCFF"/><g transform="translate(16 44) scale(.48)"><rect width="64" height="64" rx="22" fill="#3154B8"/><path d="M20 17H45V24H27V29H41V36H27V41H45V48H20Z" fill="#FFFFFF"/><circle cx="47" cy="18" r="4" fill="#C4EFE3"/><path d="M42 20L48 15" stroke="#C4EFE3" stroke-width="3"/></g><text x="57" y="67" font-family="Open Sans" font-size="18" font-weight="600" fill="#1C2638" text-anchor="start">EvoBase</text><rect x="209" y="47" width="83" height="26" rx="13" fill="#DEE5FF"/><text x="221" y="65" font-family="Open Sans" font-size="10" font-weight="600" fill="#142A62" text-anchor="start">Builder</text><rect x="326" y="43" width="44" height="44" rx="18" fill="#C4EFE3"/><text x="348" y="71" font-family="Open Sans" font-size="12" font-weight="600" fill="#003D35" text-anchor="middle">LA</text><text x="16" y="121" font-family="Open Sans" font-size="9" font-weight="600" fill="#536076" text-anchor="start">TÀI KHOẢN / KẾT NỐI</text><text x="16" y="159.0" font-family="Open Sans" font-size="27" font-weight="600" fill="#1C2638" text-anchor="start">Kết nối với công cụ bạn</text><text x="16" y="193.56" font-family="Open Sans" font-size="27" font-weight="600" fill="#1C2638" text-anchor="start">dùng</text><text x="16" y="236.12" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Chọn tài khoản, quyền gửi và mẫu nội dung.</text><rect x="16" y="264.32" width="174.546875" height="26" rx="13" fill="#DEE5FF"/><text x="28" y="282.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#142A62" text-anchor="start">Chưa có tài khoản được kết nối</text><rect x="16" y="308.32" width="358" height="70" rx="18" fill="#E1E7F7"/><text x="32" y="333.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#202D49" text-anchor="start">BUILDER · BẢN TÓM TẮT</text><text x="32" y="354.32" font-family="Open Sans" font-size="11" font-weight="400" fill="#202D49" text-anchor="start">Chỉnh cấu trúc trên màn hình rộng. Mobile ưu tiên Runtime.</text><rect x="16.0" y="394.32" width="358.0" height="170" rx="24" fill="#DEE5FF"/><text x="36.0" y="426.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">01</text><text x="36.0" y="456.32" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Email</text><text x="36.0" y="490.42" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Send / verified webhook / receipts</text><text x="36.0" y="540.3199999999999" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Test dùng fake provider đến khi có consent</text><rect x="16.0" y="580.3199999999999" width="358.0" height="170" rx="24" fill="#FBFCFF"/><text x="36.0" y="612.3199999999999" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">02</text><text x="36.0" y="642.3199999999999" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Webhook</text><text x="36.0" y="676.42" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Signature + dedup + tenant correlation</text><text x="36.0" y="726.3199999999999" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Payload không tự cấp tenant authority</text><rect x="16.0" y="766.3199999999999" width="358.0" height="170" rx="24" fill="#FBFCFF"/><text x="36.0" y="798.3199999999999" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">03</text><text x="36.0" y="828.3199999999999" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Zalo</text><text x="36.0" y="862.42" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Adapter spike cần permissions</text><text x="36.0" y="912.3199999999999" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Không coi mọi số điện thoại là recipient hợp lệ</text><rect x="16.0" y="952.3199999999999" width="358.0" height="170" rx="24" fill="#DEE5FF"/><text x="36.0" y="984.3199999999999" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">04</text><text x="36.0" y="1014.3199999999999" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Field mapping</text><text x="36.0" y="1048.4199999999998" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Order.customer → allowed recipient</text><text x="36.0" y="1098.32" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Bind secret handle; không ghi token vào AppSpec</text><rect x="16" y="1146.32" width="358" height="392" rx="24" fill="#E9EEF7"/><text x="38" y="1182.32" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Chi tiết &amp; ràng buộc</text><text x="36" y="1222.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Account</text><text x="36" y="1247.32" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Chưa kết nối</text><text x="36" y="1286.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Consent</text><text x="36" y="1311.32" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Chưa cấp</text><text x="36" y="1350.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Test delivery</text><text x="36" y="1375.32" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Disabled</text><text x="36" y="1414.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Egress</text><text x="36" y="1439.32" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Allowlisted host binding</text><text x="36" y="1478.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Result</text><text x="36" y="1503.32" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Receipt / Unknown / permanent error</text><rect x="0" y="1580.32" width="390" height="132" rx="0" fill="#FBFCFF"/><rect x="16" y="1594.32" width="358" height="48" rx="24.0" fill="#3154B8"/><text x="195.0" y="1622.32" font-family="Open Sans" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tiếp tục trên màn hình rộng</text><path d="M0 1655.32L390 1655.32" stroke="#C3CDDD" stroke-width="1" fill="none"/><g transform="translate(38 1667.32) scale(0.8636363636363636)"><path d="M3 10L11 3L19 10V19H3Z" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="49" y="1702.32" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Tổng quan</text><g transform="translate(135 1667.32) scale(0.8636363636363636)"><path d="M3 3H19V19H3ZM3 9H19M9 3V19" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="146" y="1702.32" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Bảng</text><g transform="translate(232 1667.32) scale(0.8636363636363636)"><path d="M4 5H8V9H4ZM14 13H18V17H14ZM8 7H16V13" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="243" y="1702.32" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Cấu trúc</text><g transform="translate(329 1667.32) scale(0.8636363636363636)"><path d="M11 4A7 7 0 1 1 10.9 4M11 8A3 3 0 1 1 10.9 8" fill="none" stroke="#3154B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="340" y="1702.32" font-family="Open Sans" font-size="8" font-weight="600" fill="#3154B8" text-anchor="middle">Khác</text></svg>