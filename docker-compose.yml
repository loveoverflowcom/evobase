services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evobase_demo
    ports:
      - "5432:5432"
    volumes:
      - evobase_demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evobase_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  evobase_demo_pgdata:
