<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1677.76" viewBox="0 0 390 1677.76"><title>Sẵn sàng đưa vào sử dụng?</title><desc>Original static design reference, sample data; not runtime screenshot.</desc><rect width="390" height="1677.76" fill="#F0F3F9"/><text x="16" y="19" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="start">EVOBASE · publish · STATIC DESIGN / SAMPLE DATA</text><rect x="0" y="28" width="390" height="60" rx="0" fill="#FBFCFF"/><g transform="translate(16 44) scale(.48)"><rect width="64" height="64" rx="22" fill="#3154B8"/><path d="M20 17H45V24H27V29H41V36H27V41H45V48H20Z" fill="#FFFFFF"/><circle cx="47" cy="18" r="4" fill="#C4EFE3"/><path d="M42 20L48 15" stroke="#C4EFE3" stroke-width="3"/></g><text x="57" y="67" font-family="Open Sans" font-size="18" font-weight="600" fill="#1C2638" text-anchor="start">EvoBase</text><rect x="209" y="47" width="83" height="26" rx="13" fill="#DEE5FF"/><text x="221" y="65" font-family="Open Sans" font-size="10" font-weight="600" fill="#142A62" text-anchor="start">Builder</text><rect x="326" y="43" width="44" height="44" rx="18" fill="#C4EFE3"/><text x="348" y="71" font-family="Open Sans" font-size="12" font-weight="600" fill="#003D35" text-anchor="middle">LA</text><text x="16" y="121" font-family="Open Sans" font-size="9" font-weight="600" fill="#536076" text-anchor="start">RELEASE / 1.3.0 CANDIDATE</text><text x="16" y="159.0" font-family="Open Sans" font-size="27" font-weight="600" fill="#1C2638" text-anchor="start">Sẵn sàng đưa vào sử dụng?</text><text x="16" y="201.56" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Xem thay đổi và điều kiện còn thiếu trước khi xuất bản.</text><rect x="16" y="229.76" width="161.234375" height="26" rx="13" fill="#FFE9C1"/><text x="28" y="247.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#5A3707" text-anchor="start">Còn 1 điều kiện cần hoàn tất</text><rect x="16" y="273.76" width="358" height="70" rx="18" fill="#E1E7F7"/><text x="32" y="298.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#202D49" text-anchor="start">BUILDER · BẢN TÓM TẮT</text><text x="32" y="319.76" font-family="Open Sans" font-size="11" font-weight="400" fill="#202D49" text-anchor="start">Chỉnh cấu trúc trên màn hình rộng. Mobile ưu tiên Runtime.</text><rect x="16.0" y="359.76" width="358.0" height="170" rx="24" fill="#DEE5FF"/><text x="36.0" y="391.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">01</text><text x="36.0" y="421.76" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Định nghĩa đã kiểm</text><text x="36.0" y="455.86" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">4 tables · 2 commands · 1 function</text><text x="36.0" y="505.76" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Immutable release fingerprint</text><rect x="16.0" y="545.76" width="358.0" height="170" rx="24" fill="#FBFCFF"/><text x="36.0" y="577.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">02</text><text x="36.0" y="607.76" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Tác động dữ liệu</text><text x="36.0" y="641.86" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Thêm optional field · không backfill</text><text x="36.0" y="691.76" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Không sinh business SQL table trong fixed-store subset</text><rect x="16.0" y="731.76" width="358.0" height="170" rx="24" fill="#FBFCFF"/><text x="36.0" y="763.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">03</text><text x="36.0" y="793.76" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Binding của tenant</text><text x="36.0" y="827.86" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Email chưa được cấp consent</text><text x="36.0" y="877.76" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Tắt function gửi email khi chưa có binding</text><rect x="16.0" y="917.76" width="358.0" height="170" rx="24" fill="#DEE5FF"/><text x="36.0" y="949.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">04</text><text x="36.0" y="979.76" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Điểm chặn</text><text x="36.0" y="1013.86" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Storage conformance chưa có evidence</text><text x="36.0" y="1063.76" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Không báo production-ready từ preview</text><rect x="16" y="1111.76" width="358" height="392" rx="24" fill="#E9EEF7"/><text x="38" y="1147.76" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Chi tiết &amp; ràng buộc</text><text x="36" y="1187.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">AppSpec</text><text x="36" y="1212.76" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">1.3.0</text><text x="36" y="1251.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Tenant data revision</text><text x="36" y="1276.76" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Khác model version</text><text x="36" y="1315.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Activation</text><text x="36" y="1340.76" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Atomic / có recovery plan</text><text x="36" y="1379.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Runs đang chạy</text><text x="36" y="1404.76" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Pin release cũ</text><text x="36" y="1443.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Rollback</text><text x="36" y="1468.76" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Không undo effect đã gửi</text><rect x="0" y="1545.76" width="390" height="132" rx="0" fill="#FBFCFF"/><rect x="16" y="1559.76" width="358" height="48" rx="24.0" fill="#3154B8"/><text x="195.0" y="1587.76" font-family="Open Sans" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tiếp tục trên màn hình rộng</text><path d="M0 1620.76L390 1620.76" stroke="#C3CDDD" stroke-width="1" fill="none"/><g transform="translate(38 1632.76) scale(0.8636363636363636)"><path d="M3 10L11 3L19 10V19H3Z" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="49" y="1667.76" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Tổng quan</text><g transform="translate(135 1632.76) scale(0.8636363636363636)"><path d="M3 3H19V19H3ZM3 9H19M9 3V19" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="146" y="1667.76" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Bảng</text><g transform="translate(232 1632.76) scale(0.8636363636363636)"><path d="M4 5H8V9H4ZM14 13H18V17H14ZM8 7H16V13" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="243" y="1667.76" font-family="Open Sans" font-size="8" font-weight="600" fill