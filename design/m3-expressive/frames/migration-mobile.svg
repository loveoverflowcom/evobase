<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1632.96" viewBox="0 0 390 1632.96"><title>Kiểm tra trước khi đổi kiểu</title><desc>Original static design reference, sample data; not runtime screenshot.</desc><rect width="390" height="1632.96" fill="#F0F3F9"/><text x="16" y="19" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="start">EVOBASE · migration · STATIC DESIGN / SAMPLE DATA</text><rect x="0" y="28" width="390" height="60" rx="0" fill="#FBFCFF"/><g transform="translate(16 44) scale(.48)"><rect width="64" height="64" rx="22" fill="#3154B8"/><path d="M20 17H45V24H27V29H41V36H27V41H45V48H20Z" fill="#FFFFFF"/><circle cx="47" cy="18" r="4" fill="#C4EFE3"/><path d="M42 20L48 15" stroke="#C4EFE3" stroke-width="3"/></g><text x="57" y="67" font-family="Open Sans" font-size="18" font-weight="600" fill="#1C2638" text-anchor="start">EvoBase</text><rect x="209" y="47" width="83" height="26" rx="13" fill="#DEE5FF"/><text x="221" y="65" font-family="Open Sans" font-size="10" font-weight="600" fill="#142A62" text-anchor="start">Builder</text><rect x="326" y="43" width="44" height="44" rx="18" fill="#C4EFE3"/><text x="348" y="71" font-family="Open Sans" font-size="12" font-weight="600" fill="#003D35" text-anchor="middle">LA</text><text x="16" y="121" font-family="Open Sans" font-size="9" font-weight="600" fill="#536076" text-anchor="start">SCHEMA EVOLUTION / IMPACT</text><text x="16" y="159.0" font-family="Open Sans" font-size="27" font-weight="600" fill="#1C2638" text-anchor="start">Kiểm tra trước khi đổi kiểu</text><text x="16" y="201.56" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Giải quyết dữ liệu bị ảnh hưởng trước khi áp dụng phiên bản</text><text x="16" y="220.76" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">mới.</text><rect x="16" y="248.96" width="141.703125" height="26" rx="13" fill="#DEE5FF"/><text x="28" y="266.96000000000004" font-family="Open Sans" font-size="10" font-weight="600" fill="#142A62" text-anchor="start">Chạy thử · chưa áp dụng</text><rect x="16" y="292.96000000000004" width="358" height="70" rx="18" fill="#E1E7F7"/><text x="32" y="317.96000000000004" font-family="Open Sans" font-size="10" font-weight="600" fill="#202D49" text-anchor="start">BUILDER · BẢN TÓM TẮT</text><text x="32" y="338.96000000000004" font-family="Open Sans" font-size="11" font-weight="400" fill="#202D49" text-anchor="start">Chỉnh cấu trúc trên màn hình rộng. Mobile ưu tiên Runtime.</text><rect x="16.0" y="378.96000000000004" width="358.0" height="170" rx="24" fill="#DEE5FF"/><text x="36.0" y="410.96000000000004" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">01</text><text x="36.0" y="440.96000000000004" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Đổi field required</text><text x="36.0" y="475.06000000000006" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">customer: optional → required</text><text x="36.0" y="524.96" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">7 record thiếu giá trị cần giải quyết</text><rect x="16.0" y="564.96" width="358.0" height="170" rx="24" fill="#FBFCFF"/><text x="36.0" y="596.96" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">02</text><text x="36.0" y="626.96" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Backfill có kiểm</text><text x="36.0" y="661.0600000000001" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Map stable IDs và policy</text><text x="36.0" y="710.96" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Không ghi đè field người dùng vừa sửa</text><rect x="16.0" y="750.96" width="358.0" height="170" rx="24" fill="#FBFCFF"/><text x="36.0" y="782.96" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">03</text><text x="36.0" y="812.96" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Atomic activation</text><text x="36.0" y="847.0600000000001" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Revalidate → cutover → fencing</text><text x="36.0" y="896.96" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">App instance giữ revision cũ nếu gate lỗi</text><rect x="16.0" y="936.96" width="358.0" height="170" rx="24" fill="#DEE5FF"/><text x="36.0" y="968.96" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">04</text><text x="36.0" y="998.96" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Recovery</text><text x="36.0" y="1033.06" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Export / restore theo scope</text><text x="36.0" y="1082.96" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Không hồi sinh revoked grants hoặc replay effects</text><rect x="16" y="1130.96" width="358" height="328" rx="24" fill="#E9EEF7"/><text x="38" y="1166.96" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Chi tiết &amp; ràng buộc</text><text x="36" y="1206.96" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Ảnh hưởng</text><text x="36" y="1231.96" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">7 / 148 orders (fixture)</text><text x="36" y="1270.96" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Quyền</text><text x="36" y="1295.96" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Migration operator</text><text x="36" y="1334.96" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Recovery</text><text x="36" y="1359.96" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Bắt buộc xác minh</text><text x="36" y="1398.96" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Dữ liệu live</text><text x="36" y="1423.96" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Chưa chạm</text><rect x="0" y="1500.96" width="390" height="132" rx="0" fill="#FBFCFF"/><rect x="16" y="1514.96" width="358" height="48" rx="24.0" fill="#3154B8"/><text x="195.0" y="1542.96" font-family="Open Sans" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tiếp tục trên màn hình rộng</text><path d="M0 1575.96L390 1575.96" stroke="#C3CDDD" stroke-width="1" fill="none"/><g transform="translate(38 1587.96) scale(0.8636363636363636)"><path d="M3 10L11 3L19 10V19H3Z" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="49" y="1622.96" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Tổng quan</text><g transform="translate(135 1587.96) scale(0.8636363636363636)"><path d="M3 3H19V19H3ZM3 9H19M9 3V19" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="146" y="1622.96" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Bảng</text><g transform="translate(232 1587.96) scale(0.8636363636363636)"><path d="M4 5H8V9H4ZM14 13H18V17H14ZM8 7H16V13" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="243" y="1622.96" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Cấu trúc</text><g transform="tra