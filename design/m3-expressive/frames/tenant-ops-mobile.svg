<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1591.76" viewBox="0 0 390 1591.76"><title>Cô lập có thể kiểm chứng</title><desc>Original static design reference, sample data; not runtime screenshot.</desc><rect width="390" height="1591.76" fill="#F0F3F9"/><text x="16" y="19" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="start">EVOBASE · tenant-ops · STATIC DESIGN / SAMPLE DATA</text><rect x="0" y="28" width="390" height="60" rx="0" fill="#FBFCFF"/><g transform="translate(16 44) scale(.48)"><rect width="64" height="64" rx="22" fill="#3154B8"/><path d="M20 17H45V24H27V29H41V36H27V41H45V48H20Z" fill="#FFFFFF"/><circle cx="47" cy="18" r="4" fill="#C4EFE3"/><path d="M42 20L48 15" stroke="#C4EFE3" stroke-width="3"/></g><text x="57" y="67" font-family="Open Sans" font-size="18" font-weight="600" fill="#1C2638" text-anchor="start">EvoBase</text><rect x="209" y="47" width="83" height="26" rx="13" fill="#DEE5FF"/><text x="221" y="65" font-family="Open Sans" font-size="10" font-weight="600" fill="#142A62" text-anchor="start">Platform</text><rect x="326" y="43" width="44" height="44" rx="18" fill="#C4EFE3"/><text x="348" y="71" font-family="Open Sans" font-size="12" font-weight="600" fill="#003D35" text-anchor="middle">LA</text><text x="16" y="121" font-family="Open Sans" font-size="9" font-weight="600" fill="#536076" text-anchor="start">HOSTED / ISOLATION SPIKE</text><text x="16" y="159.0" font-family="Open Sans" font-size="27" font-weight="600" fill="#1C2638" text-anchor="start">Cô lập có thể kiểm chứng</text><text x="16" y="201.56" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Định nghĩa chung, dữ liệu và binding riêng từng tenant.</text><rect x="16" y="229.76" width="170.1875" height="26" rx="13" fill="#DEE5FF"/><text x="28" y="247.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#142A62" text-anchor="start">Thiết kế spike · chưa provision</text><rect x="16.0" y="273.76" width="358.0" height="170" rx="24" fill="#DEE5FF"/><text x="36.0" y="305.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">01</text><text x="36.0" y="335.76" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Tenant A · Blueprint</text><text x="36.0" y="369.86" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Database A / fixed engine layout</text><text x="36.0" y="419.76" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Runtime role: no DDL, no BYPASSRLS</text><rect x="16.0" y="459.76" width="358.0" height="170" rx="24" fill="#FBFCFF"/><text x="36.0" y="491.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">02</text><text x="36.0" y="521.76" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Tenant B · Northstar</text><text x="36.0" y="555.86" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Database B / same AppSpec release</text><text x="36.0" y="605.76" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Field/policy ở A không thay B</text><rect x="16.0" y="645.76" width="358.0" height="170" rx="24" fill="#FBFCFF"/><text x="36.0" y="677.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">03</text><text x="36.0" y="707.76" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Resource budgets</text><text x="36.0" y="741.86" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Bounded pools · fair scheduling</text><text x="36.0" y="791.76" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">DB riêng trong cùng cluster vẫn chia CPU / I/O</text><rect x="16.0" y="831.76" width="358.0" height="170" rx="24" fill="#DEE5FF"/><text x="36.0" y="863.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">04</text><text x="36.0" y="893.76" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Negative evidence</text><text x="36.0" y="927.86" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">API · refs · subscriptions · cache · blobs</text><text x="36.0" y="977.76" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Không quảng cáo hard/physical isolation</text><rect x="16" y="1025.76" width="358" height="392" rx="24" fill="#E9EEF7"/><text x="38" y="1061.76" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Chi tiết &amp; ràng buộc</text><text x="36" y="1101.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Quyền</text><text x="36" y="1126.76" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Platform operator</text><text x="36" y="1165.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Provisioning</text><text x="36" y="1190.76" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Vai trò riêng runtime</text><text x="36" y="1229.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Adapter</text><text x="36" y="1254.76" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Đề xuất; ADR sau đo</text><text x="36" y="1293.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Backup</text><text x="36" y="1318.76" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Scoped; không hứa tenant PITR</text><text x="36" y="1357.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Secrets</text><text x="36" y="1382.76" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Chỉ handle, không portable</text><rect x="0" y="1459.76" width="390" height="132" rx="0" fill="#FBFCFF"/><rect x="16" y="1473.76" width="358" height="48" rx="24.0" fill="#3154B8"/><text x="195.0" y="1501.76" font-family="Open Sans" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Mở báo cáo conformance</text><path d="M0 1534.76L390 1534.76" stroke="#C3CDDD" stroke-width="1" fill="none"/><g transform="translate(38 1546.76) scale(0.8636363636363636)"><path d="M3 10L11 3L19 10V19H3Z" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="49" y="1581.76" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Tổng quan</text><g transform="translate(135 1546.76) scale(0.8636363636363636)"><path d="M3 3H19V19H3ZM3 9H19M9 3V19" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="146" y="1581.76" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Bảng</text><g transform="translate(232 1546.76) scale(0.8636363636363636)"><path d="M4 5H8V9H4ZM14 13H18V17H14ZM8 7H16V13" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="243" y="1581.76" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Cấu trúc</text><g transform="translate(329 1546.76) scale(0.8636363636363636)"><path d="M11 4A7 7 0 1 1 10.9 4M11 8A3 3 0 1 1 10.9 8" fill="none" stroke="#3154B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="340" y="1581.76" font-family="Open Sans" font-size="8" font-weight="600" fill="#3154B8" text-anchor="middle">Khác</text></svg>