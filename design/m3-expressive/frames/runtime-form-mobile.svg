54" rx="12" fill="#F0F3F9"/><text x="51.0" y="682.96" font-family="Open Sans" font-size="12" font-weight="400" fill="#1C2638" text-anchor="start">2</text><text x="36.0" y="740.96" font-family="Open Sans" font-size="11" font-weight="600" fill="#536076" text-anchor="start">Đơn giá trong đơn</text><rect x="36.0" y="753.96" width="318.0" height="54" rx="12" fill="#F0F3F9"/><text x="51.0" y="776.96" font-family="Open Sans" font-size="12" font-weight="400" fill="#1C2638" text-anchor="start">2.310.000 ₫ · giữ nguyên sau khi lưu</text><text x="36.0" y="834.96" font-family="Open Sans" font-size="11" font-weight="600" fill="#536076" text-anchor="start">Ghi chú</text><rect x="36.0" y="847.96" width="318.0" height="54" rx="12" fill="#F0F3F9"/><text x="51.0" y="870.96" font-family="Open Sans" font-size="12" font-weight="400" fill="#1C2638" text-anchor="start">Giao trong giờ làm việc</text><rect x="16.0" y="956.96" width="358.0" height="144" rx="24" fill="#DEE5FF"/><text x="36.0" y="988.96" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">01</text><text x="36.0" y="1018.96" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Tổng tạm tính</text><text x="36.0" y="1053.06" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">4.620.000 ₫</text><text x="36.0" y="1076.96" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Tổng được kiểm tra lại khi lưu</text><rect x="16.0" y="1116.96" width="358.0" height="144" rx="24" fill="#FBFCFF"/><text x="36.0" y="1148.96" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">02</text><text x="36.0" y="1178.96" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Lưu trước, gửi sau</text><text x="36.0" y="1213.06" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Lưu nháp không gửi đơn hàng</text><text x="36.0" y="1236.96" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Khi mất mạng, hiển thị chưa đồng bộ</text><rect x="0" y="1318.96" width="390" height="132" rx="0" fill="#FBFCFF"/><rect x="16" y="1332.96" width="358" height="48" rx="24.0" fill="#3154B8"/><text x="195.0" y="1360.96" font-family="Open Sans" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Lưu đơn nháp</text><path d="M0 1393.96L390 1393.96" stroke="#C3CDDD" stroke-width="1" fill="none"/><g transform="translate(38 1405.96) scale(0.8636363636363636)"><path d="M3 10L11 3L19 10V19H3Z" fill="none" stroke="#3154B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="49" y="1440.96" font-family="Open Sans" font-size="8" font-weight="600" fill="#3154B8" text-anchor="middle">Đơn hàng</text><g transform="translate(135 1405.96) scale(0.8636363636363636)"><path d="M4 3H18V19H4ZM7 7L9 9L13 5M7 14H15" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="146" y="1440.96" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Công việc</text><g transform="translate(232 1405.96) scale(0.8636363636363636)"><path d="M3 4H19V16H10L5 20V16H3Z" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="243" y="1440.96" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Hộp thư</text><g transform="translate(329 1405.96) scale(0.8636363636363636)"><path d="M11 4A7 7 0 1 1 10.9 4M11 8A3 3 0 1 1 10.9 8" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="340" y="1440.96" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Khác</text></svg>