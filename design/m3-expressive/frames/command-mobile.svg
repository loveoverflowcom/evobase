<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1480.32" viewBox="0 0 390 1480.32"><title>Gửi đơn hàng đúng điều kiện</title><desc>Original static design reference, sample data; not runtime screenshot.</desc><rect width="390" height="1480.32" fill="#F0F3F9"/><text x="16" y="19" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="start">EVOBASE · command · STATIC DESIGN / SAMPLE DATA</text><rect x="0" y="28" width="390" height="60" rx="0" fill="#FBFCFF"/><g transform="translate(16 44) scale(.48)"><rect width="64" height="64" rx="22" fill="#3154B8"/><path d="M20 17H45V24H27V29H41V36H27V41H45V48H20Z" fill="#FFFFFF"/><circle cx="47" cy="18" r="4" fill="#C4EFE3"/><path d="M42 20L48 15" stroke="#C4EFE3" stroke-width="3"/></g><text x="57" y="67" font-family="Open Sans" font-size="18" font-weight="600" fill="#1C2638" text-anchor="start">EvoBase</text><rect x="209" y="47" width="83" height="26" rx="13" fill="#DEE5FF"/><text x="221" y="65" font-family="Open Sans" font-size="10" font-weight="600" fill="#142A62" text-anchor="start">Builder</text><rect x="326" y="43" width="44" height="44" rx="18" fill="#C4EFE3"/><text x="348" y="71" font-family="Open Sans" font-size="12" font-weight="600" fill="#003D35" text-anchor="middle">LA</text><text x="16" y="121" font-family="Open Sans" font-size="9" font-weight="600" fill="#536076" text-anchor="start">HÀNH ĐỘNG / GỬI ĐƠN HÀNG</text><text x="16" y="159.0" font-family="Open Sans" font-size="27" font-weight="600" fill="#1C2638" text-anchor="start">Gửi đơn hàng đúng điều</text><text x="16" y="193.56" font-family="Open Sans" font-size="27" font-weight="600" fill="#1C2638" text-anchor="start">kiện</text><text x="16" y="236.12" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Chỉ cho gửi khi đơn đủ thông tin và người gửi có quyền.</text><rect x="16" y="264.32" width="101.21875" height="26" rx="13" fill="#DEE5FF"/><text x="28" y="282.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#142A62" text-anchor="start">Hành động mẫu</text><rect x="16" y="308.32" width="358" height="70" rx="18" fill="#E1E7F7"/><text x="32" y="333.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#202D49" text-anchor="start">BUILDER · BẢN TÓM TẮT</text><text x="32" y="354.32" font-family="Open Sans" font-size="11" font-weight="400" fill="#202D49" text-anchor="start">Chỉnh cấu trúc trên màn hình rộng. Mobile ưu tiên Runtime.</text><rect x="16" y="394.32" width="358" height="504" rx="24" fill="#FBFCFF"/><text x="38" y="430.32" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Các bước có kiểu</text><rect x="36" y="453.32" width="318" height="70" rx="18" fill="#DEE5FF"/><rect x="49" y="467.32" width="42" height="42" rx="14" fill="#3154B8"/><text x="70" y="493.32" font-family="Open Sans" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text><text x="104" y="479.32" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Quyền</text><text x="104" y="503.32" font-family="Open Sans" font-size="11" font-weight="400" fill="#536076" text-anchor="start">Người dùng được phép gửi đơn</text><path d="M70 524.3199999999999L70 538.3199999999999" stroke="#738198" stroke-width="2" fill="none"/><rect x="36" y="539.3199999999999" width="318" height="70" rx="18" fill="#F0F3F9"/><rect x="49" y="553.3199999999999" width="42" height="42" rx="14" fill="#C4EFE3"/><text x="70" y="579.3199999999999" font-family="Open Sans" font-size="16" font-weight="600" fill="#003D35" text-anchor="middle">2</text><text x="104" y="565.3199999999999" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Điều kiện</text><text x="104" y="589.3199999999999" font-family="Open Sans" font-size="11" font-weight="400" fill="#536076" text-anchor="start">Đơn là Nháp · có ít nhất 1 sản phẩm</text><path d="M70 610.3199999999999L70 624.3199999999999" stroke="#738198" stroke-width="2" fill="none"/><rect x="36" y="625.3199999999999" width="318" height="70" rx="18" fill="#F0F3F9"/><rect x="49" y="639.3199999999999" width="42" height="42" rx="14" fill="#C4EFE3"/><text x="70" y="665.3199999999999" font-family="Open Sans" font-size="16" font-weight="600" fill="#003D35" text-anchor="middle">3</text><text x="104" y="651.3199999999999" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Thay đổi</text><text x="104" y="675.3199999999999" font-family="Open Sans" font-size="11" font-weight="400" fill="#536076" text-anchor="start">Nháp → Đã gửi</text><path d="M70 696.3199999999999L70 710.3199999999999" stroke="#738198" stroke-width="2" fill="none"/><rect x="36" y="711.3199999999999" width="318" height="70" rx="18" fill="#F0F3F9"/><rect x="49" y="725.3199999999999" width="42" height="42" rx="14" fill="#C4EFE3"/><text x="70" y="751.3199999999999" font-family="Open Sans" font-size="16" font-weight="600" fill="#003D35" text-anchor="middle">4</text><text x="104" y="737.3199999999999" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Ghi nhận</text><text x="104" y="761.3199999999999" font-family="Open Sans" font-size="11" font-weight="400" fill="#536076" text-anchor="start">Lưu đơn và yêu cầu thông báo cùng nhau</text><path d="M70 782.3199999999999L70 796.3199999999999" stroke="#738198" stroke-width="2" fill="none"/><rect x="36" y="797.3199999999999" width="318" height="70" rx="18" fill="#F0F3F9"/><rect x="49" y="811.3199999999999" width="42" height="42" rx="14" fill="#C4EFE3"/><text x="70" y="837.3199999999999" font-family="Open Sans" font-size="16" font-weight="600" fill="#003D35" text-anchor="middle">5</text><text x="104" y="823.3199999999999" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Sau khi lưu</text><text x="104" y="847.3199999999999" font-family="Open Sans" font-size="11" font-weight="400" fill="#536076" text-anchor="start">Tiến hành gửi thông báo nếu đủ quyền</text><rect x="16" y="914.3199999999999" width="358" height="392" rx="24" fill="#E9EEF7"/><text x="38" y="950.3199999999999" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Chi tiết &amp; ràng buộc</text><text x="36" y="990.3199999999999" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Input</text><text x="36" y="1015.3199999999999" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Ref&lt;Orders&gt;</text><text x="36" y="1054.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Idempotency</text><text x="36" y="1079.32" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Request key + immutable intent</text><text x="36" y="1118.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Xung đột</text><text x="36" y="1143.32" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">409 / tải lại revision</text><text x="36" y="1182.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Mutation</text><text x="36" y="1207.32" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Kiểm old + new state</text><text x="36" y="1246.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Output</text><text x="36" y="1271.32" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Typed receipt</text><rect x="0" y="1348.32" width="390" height="132" rx="0" fill="#FBFCFF"/><rect x="16" y="1362.32" width="358" height="48" rx="24.0" fill="#3154B8"/><text x="195.0" y="1390.32" font-family="Open Sans" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle