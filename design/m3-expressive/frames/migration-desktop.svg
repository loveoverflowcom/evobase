t">Giải quyết dữ liệu bị ảnh hưởng trước khi áp dụng phiên bản mới.</text><rect x="264" y="255.88" width="141.703125" height="26" rx="13" fill="#DEE5FF"/><text x="276" y="273.88" font-family="Open Sans" font-size="10" font-weight="600" fill="#142A62" text-anchor="start">Chạy thử · chưa áp dụng</text><rect x="1151" y="153" width="245" height="48" rx="24.0" fill="#3154B8"/><text x="1273.5" y="181.0" font-family="Open Sans" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tạo kế hoạch migration</text><rect x="264.0" y="299.88" width="828.0" height="170" rx="24" fill="#DEE5FF"/><text x="284.0" y="331.88" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">01</text><text x="284.0" y="361.88" font-family="Open Sans" font-size="18" font-weight="600" fill="#1C2638" text-anchor="start">Đổi field required</text><text x="284.0" y="397.28" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">customer: optional → required</text><text x="284.0" y="445.88" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">7 record thiếu giá trị cần giải quyết</text><rect x="264.0" y="485.88" width="828.0" height="170" rx="24" fill="#FBFCFF"/><text x="284.0" y="517.88" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">02</text><text x="284.0" y="547.88" font-family="Open Sans" font-size="18" font-weight="600" fill="#1C2638" text-anchor="start">Backfill có kiểm</text><text x="284.0" y="583.28" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Map stable IDs và policy</text><text x="284.0" y="631.88" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Không ghi đè field người dùng vừa sửa</text><rect x="264.0" y="671.88" width="828.0" height="170" rx="24" fill="#FBFCFF"/><text x="284.0" y="703.88" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">03</text><text x="284.0" y="733.88" font-family="Open Sans" font-size="18" font-weight="600" fill="#1C2638" text-anchor="start">Atomic activation</text><text x="284.0" y="769.28" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Revalidate → cutover → fencing</text><text x="284.0" y="817.88" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">App instance giữ revision cũ nếu gate lỗi</text><rect x="264.0" y="857.88" width="828.0" height="170" rx="24" fill="#DEE5FF"/><text x="284.0" y="889.88" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">04</text><text x="284.0" y="919.88" font-family="Open Sans" font-size="18" font-weight="600" fill="#1C2638" text-anchor="start">Recovery</text><text x="284.0" y="955.28" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Export / restore theo scope</text><text x="284.0" y="1003.8800000000001" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Không hồi sinh revoked grants hoặc replay effects</text><rect x="1112" y="299.88" width="284" height="728.0000000000001" rx="24" fill="#E9EEF7"/><text x="1134" y="335.88" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Chi tiết &amp; ràng buộc</text><text x="1132" y="375.88" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Ảnh hưởng</text><text x="1132" y="400.88" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">7 / 148 orders (fixture)</text><text x="1132" y="439.88" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Quyền</text><text x="1132" y="464.88" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Migration operator</text><t