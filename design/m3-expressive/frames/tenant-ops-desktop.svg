<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1107.88" viewBox="0 0 1440 1107.88"><title>Cô lập có thể kiểm chứng</title><desc>Original static design reference, sample data; not runtime screenshot.</desc><rect width="1440" height="1107.88" fill="#F0F3F9"/><text x="28" y="19" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="start">EVOBASE · tenant-ops · STATIC DESIGN / SAMPLE DATA</text><rect x="0" y="28" width="1440" height="68" rx="0" fill="#FBFCFF"/><g transform="translate(28 44) scale(.48)"><rect width="64" height="64" rx="22" fill="#3154B8"/><path d="M20 17H45V24H27V29H41V36H27V41H45V48H20Z" fill="#FFFFFF"/><circle cx="47" cy="18" r="4" fill="#C4EFE3"/><path d="M42 20L48 15" stroke="#C4EFE3" stroke-width="3"/></g><text x="70" y="67" font-family="Open Sans" font-size="18" font-weight="600" fill="#1C2638" text-anchor="start">EvoBase</text><rect x="245" y="47" width="103" height="26" rx="13" fill="#DEE5FF"/><text x="257" y="65" font-family="Open Sans" font-size="10" font-weight="600" fill="#142A62" text-anchor="start">Platform</text><text x="370" y="67" font-family="Open Sans" font-size="13" font-weight="400" fill="#536076" text-anchor="start">Không gian   /   Bán hàng</text><rect x="977" y="42" width="310" height="44" rx="22" fill="#F0F3F9"/><text x="996" y="70" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Tìm bảng, record, hành động…</text><rect x="1352" y="42" width="44" height="44" rx="18" fill="#C4EFE3"/><text x="1374" y="70" font-family="Open Sans" font-size="12" font-weight="600" fill="#003D35" text-anchor="middle">LA</text><rect x="20" y="112" width="216" height="848" rx="24" fill="#FBFCFF"/><text x="40" y="146" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">KHÔNG GIAN</text><text x="40" y="173" font-family="Open Sans" font-size="18" font-weight="600" fill="#1C2638" text-anchor="start">Bán hàng</text><rect x="30" y="201" width="196" height="49" rx="18" fill="#DEE5FF"/><g transform="translate(44 214) scale(0.9090909090909091)"><path d="M3 3H19V19H3ZM3 9H19M9 3V19" fill="none" stroke="#142A62" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="75" y="231" font-family="Open Sans" font-size="10.5" font-weight="600" fill="#142A62" text-anchor="start">Tenant &amp; Lưu trữ</text><path d="M40 776L214 776" stroke="#C3CDDD" stroke-width="1" fill="none"/><rect x="40" y="799" width="174" height="26" rx="13" fill="#DEE5FF"/><text x="52" y="817" font-family="Open Sans" font-size="10" font-weight="600" fill="#142A62" text-anchor="start">DESIGN KIT</text><text x="40" y="849.0" font-family="Open Sans" font-size="11" font-weight="400" fill="#536076" text-anchor="start">Builder và Runtime có quyền và</text><text x="40" y="866.6" font-family="Open Sans" font-size="11" font-weight="400" fill="#536076" text-anchor="start">vòng đời riêng.</text><text x="40" y="931" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">?  Trợ giúp</text><text x="264" y="134" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">HOSTED / ISOLATION SPIKE</text><text x="264" y="172.0" font-family="Open Sans" font-size="36" font-weight="600" fill="#1C2638" text-anchor="start">Cô lập có thể kiểm chứng</text><text x="264" y="226.07999999999998" font-family="Open Sans" font-size="13" font-weight="400" fill="#536076" text-anchor="start">Định nghĩa chung, dữ liệu và binding riêng từng tenant.</text><rect x="264" y="255.88" width="170.1875" height="26" rx="13" fill="#DEE5FF"/><text x="276" y="273.88" font-family="Open Sans" font-size="10" font-weight="600" fill="#142A62" text-anchor="start">Thiết kế spike · chưa provision</text><rect x="1151" y="153" width="245" height="48" rx="24.0" fill="#3154B8"/><text x="1273.5" y="181.0" font-family="Open Sans" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Mở báo cáo conformance</text><rect x="264.0" y="299.88" width="828.0" height="170" rx="24" fill="#DEE5FF"/><text x="284.0" y="331.88" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">01</text><text x="284.0" y="361.88" font-family="Open Sans" font-size="18" font-weight="600" fill="#1C2638" text-anchor="start">Tenant A · Blueprint</text><text x="284.0" y="397.28" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Database A / fixed engine layout</text><text x="284.0" y="445.88" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Runtime role: no DDL, no BYPASSRLS</text><rect x="264.0" y="485.88" width="828.0" height="170" rx="24" fill="#FBFCFF"/><text x="284.0" y="517.88" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">02</text><text x="284.0" y="547.88" font-family="Open Sans" font-size="18" font-weight="600" fill="#1C2638" text-anchor="start">Tenant B · Northstar</text><text x="284.0" y="583.28" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Database B / same AppSpec release</text><text x="284.0" y="631.88" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Field/policy ở A không thay B</text><rect x="264.0" y="671.88" width="828.0" height="170" rx="24" fill="#FBFCFF"/><text x="284.0" y="703.88" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">03</text><text x="284.0" y="733.88" font-family="Open Sans" font-size="18" font-weight="600" fill="#1C2638" text-anchor="start">Resource budgets</text><text x="284.0" y="769.28" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Bounded pools · fair scheduling</text><text x="284.0" y="817.88" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">DB riêng trong cùng cluster vẫn chia CPU / I/O</text><rect x="264.0" y="857.88" width="828.0" height="170" rx="24" fill="#DEE5FF"/><text x="284.0" y="889.88" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">04</text><text x="284.0" y="919.88" font-family="Open Sans" font-size="18" font-weight="600" fill="#1C2638" text-anchor="start">Negative evidence</text><text x="284.0" y="955.28" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">API · refs · subscriptions · cache · blobs</text><text x="284.0" y="1003.8800000000001" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Không quảng cáo hard/physical isolation</text><rect x="1112" y="299.88" width="284" height="728.0000000000001" rx="24" fill="#E9EEF7"/><text x="1134" y="335.88" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Chi tiết &amp; ràng buộc</text><text x="1132" y="375.88" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Quyền</text><text x="1132" y="400.88" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Platform operator</text><text x="1132" y="439.88" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Provisioning</text><text x="1132" y="464.88" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Vai trò riêng runtime</text><text x="1132" y="503.88" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Adapter</text><text x="1132" y="528.88" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Đề xuất; ADR sau đo</text><text x="1132" y="567.88" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Backup</text><text x="1132" y="592.88" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Scoped; không hứa tenant PITR</text><text x="1132" y="631.88" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Secrets</text><text x="1132" y="656.88" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Chỉ handle, không portable</text><text x="264" y="1085.88" font-family="Open Sans" font-size="9" font-weight="400" fill="#536076" text-anchor="start">DESIGN REFERENCE ONLY · Static SVG raster · Không phải browser screenshot hoặc production evidence</text></svg>