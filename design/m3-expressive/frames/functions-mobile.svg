<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1566.32" viewBox="0 0 390 1566.32"><title>Đơn gửi đi, đúng người duyệt</title><desc>Original static design reference, sample data; not runtime screenshot.</desc><rect width="390" height="1566.32" fill="#F0F3F9"/><text x="16" y="19" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="start">EVOBASE · functions · STATIC DESIGN / SAMPLE DATA</text><rect x="0" y="28" width="390" height="60" rx="0" fill="#FBFCFF"/><g transform="translate(16 44) scale(.48)"><rect width="64" height="64" rx="22" fill="#3154B8"/><path d="M20 17H45V24H27V29H41V36H27V41H45V48H20Z" fill="#FFFFFF"/><circle cx="47" cy="18" r="4" fill="#C4EFE3"/><path d="M42 20L48 15" stroke="#C4EFE3" stroke-width="3"/></g><text x="57" y="67" font-family="Open Sans" font-size="18" font-weight="600" fill="#1C2638" text-anchor="start">EvoBase</text><rect x="209" y="47" width="83" height="26" rx="13" fill="#DEE5FF"/><text x="221" y="65" font-family="Open Sans" font-size="10" font-weight="600" fill="#142A62" text-anchor="start">Builder</text><rect x="326" y="43" width="44" height="44" rx="18" fill="#C4EFE3"/><text x="348" y="71" font-family="Open Sans" font-size="12" font-weight="600" fill="#003D35" text-anchor="middle">LA</text><text x="16" y="121" font-family="Open Sans" font-size="9" font-weight="600" fill="#536076" text-anchor="start">QUY TRÌNH / DUYỆT ĐƠN HÀNG</text><text x="16" y="159.0" font-family="Open Sans" font-size="27" font-weight="600" fill="#1C2638" text-anchor="start">Đơn gửi đi, đúng người</text><text x="16" y="193.56" font-family="Open Sans" font-size="27" font-weight="600" fill="#1C2638" text-anchor="start">duyệt</text><text x="16" y="236.12" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Kết nối các bước, điều kiện và xử lý khi quá hạn.</text><rect x="16" y="264.32" width="174.0" height="26" rx="13" fill="#DEE5FF"/><text x="28" y="282.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#142A62" text-anchor="start">Quy trình mẫu · chưa chạy thật</text><rect x="16" y="308.32" width="358" height="70" rx="18" fill="#E1E7F7"/><text x="32" y="333.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#202D49" text-anchor="start">BUILDER · BẢN TÓM TẮT</text><text x="32" y="354.32" font-family="Open Sans" font-size="11" font-weight="400" fill="#202D49" text-anchor="start">Chỉnh cấu trúc trên màn hình rộng. Mobile ưu tiên Runtime.</text><rect x="16" y="394.32" width="358" height="590" rx="24" fill="#FBFCFF"/><text x="38" y="430.32" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Các bước có kiểu</text><rect x="36" y="453.32" width="318" height="70" rx="18" fill="#DEE5FF"/><rect x="49" y="467.32" width="42" height="42" rx="14" fill="#3154B8"/><text x="70" y="493.32" font-family="Open Sans" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text><text x="104" y="479.32" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Trigger</text><text x="104" y="503.32" font-family="Open Sans" font-size="11" font-weight="400" fill="#536076" text-anchor="start">OrderSubmitted · typed event</text><path d="M70 524.3199999999999L70 538.3199999999999" stroke="#738198" stroke-width="2" fill="none"/><rect x="36" y="539.3199999999999" width="318" height="70" rx="18" fill="#F0F3F9"/><rect x="49" y="553.3199999999999" width="42" height="42" rx="14" fill="#C4EFE3"/><text x="70" y="579.3199999999999" font-family="Open Sans" font-size="16" font-weight="600" fill="#003D35" text-anchor="middle">2</text><text x="104" y="565.3199999999999" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Điều kiện</text><text x="104" y="589.3199999999999" font-family="Open Sans" font-size="11" font-weight="400" fill="#536076" text-anchor="start">total &gt; approval_threshold</text><path d="M70 610.3199999999999L70 624.3199999999999" stroke="#738198" stroke-width="2" fill="none"/><rect x="36" y="625.3199999999999" width="318" height="70" rx="18" fill="#F0F3F9"/><rect x="49" y="639.3199999999999" width="42" height="42" rx="14" fill="#C4EFE3"/><text x="70" y="665.3199999999999" font-family="Open Sans" font-size="16" font-weight="600" fill="#003D35" text-anchor="middle">3</text><text x="104" y="651.3199999999999" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Command</text><text x="104" y="675.3199999999999" font-family="Open Sans" font-size="11" font-weight="400" fill="#536076" text-anchor="start">CreateApprovalTask(order)</text><path d="M70 696.3199999999999L70 710.3199999999999" stroke="#738198" stroke-width="2" fill="none"/><rect x="36" y="711.3199999999999" width="318" height="70" rx="18" fill="#F0F3F9"/><rect x="49" y="725.3199999999999" width="42" height="42" rx="14" fill="#C4EFE3"/><text x="70" y="751.3199999999999" font-family="Open Sans" font-size="16" font-weight="600" fill="#003D35" text-anchor="middle">4</text><text x="104" y="737.3199999999999" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Enqueue</text><text x="104" y="761.3199999999999" font-family="Open Sans" font-size="11" font-weight="400" fill="#536076" text-anchor="start">Email notification · consent required</text><path d="M70 782.3199999999999L70 796.3199999999999" stroke="#738198" stroke-width="2" fill="none"/><rect x="36" y="797.3199999999999" width="318" height="70" rx="18" fill="#F0F3F9"/><rect x="49" y="811.3199999999999" width="42" height="42" rx="14" fill="#C4EFE3"/><text x="70" y="837.3199999999999" font-family="Open Sans" font-size="16" font-weight="600" fill="#003D35" text-anchor="middle">5</text><text x="104" y="823.3199999999999" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Wait</text><text x="104" y="847.3199999999999" font-family="Open Sans" font-size="11" font-weight="400" fill="#536076" text-anchor="start">Approve / Reject / Deadline</text><path d="M70 868.3199999999999L70 882.3199999999999" stroke="#738198" stroke-width="2" fill="none"/><rect x="36" y="883.3199999999999" width="318" height="70" rx="18" fill="#F0F3F9"/><rect x="49" y="897.3199999999999" width="42" height="42" rx="14" fill="#C4EFE3"/><text x="70" y="923.3199999999999" font-family="Open Sans" font-size="16" font-weight="600" fill="#003D35" text-anchor="middle">6</text><text x="104" y="909.3199999999999" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Transition</text><text x="104" y="933.3199999999999" font-family="Open Sans" font-size="11" font-weight="400" fill="#536076" text-anchor="start">Checked command + receipt</text><rect x="16" y="1000.3199999999999" width="358" height="392" rx="24" fill="#E9EEF7"/><text x="38" y="1036.32" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Chi tiết &amp; ràng buộc</text><text x="36" y="1076.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Retry</text><text x="36" y="1101.32" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Transient · bounded backoff</text><text x="36" y="1140.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Timeout</text><text x="36" y="1165.32" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">24h · branch riêng</text><text x="36" y="1204.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Failure</text><text x="36" y="1229.32" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Quarantine / operator</text><text x="36" y="1268.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Collection</text><text x="36" y="1293.32" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Bounded · no recursion</text><text x="36" y="1332.32" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Preview</text><text x="36" y="1357.32" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Zero external delivery</text><rect x="0" y="1434.32" width="390" height="132" rx="0" fill="#FBFCFF"/><rect x="16" y="1448.32" width="358" height="48" rx="24.0" fill="#3154B8"/><text x="195.0" y="1476.32" font-family="Open Sans" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tiếp tục trên màn hình rộng</text><path d="M0 1509.32L390 1509.32" stroke="#C3CDDD" stroke-width="1" fill="none"/><g transform="translate(38 1521.32) scale(0.8636363636363636)"><path d="M3 10L11 3L19 10V19H3Z" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="49" y="1556.32" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Tổng quan</text><g transform="translate(135 1521.32) scale(0.8636363636363636)"><path d="M3 3H19V19H3ZM3 9H19M9 3V19" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="146" y="1556.32" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Bảng</text><g transform="translate(232 1521.32) scale(0.8636363636363636)"><path d="M4 5H8V9H4ZM14 13H18V17H14ZM8 7H16V13" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="243" y="1556.32" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Cấu trúc</text><g transform="translate(329 1521.32) scale(0.8636363636363636)"><path d="M11 4A7 7 0 1 1 10.9 4M11 8A3 3 0 1 1 10.9 8" fill="none" stroke="#3154B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="340" y="1556.32" font-family="Open Sans" font-size="8" font-weight="600" fill="#3154B8" text-anchor="middle">Khác</text></svg>