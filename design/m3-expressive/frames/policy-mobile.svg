<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1489.76" viewBox="0 0 390 1489.76"><title>Ai được xem đơn hàng?</title><desc>Original static design reference, sample data; not runtime screenshot.</desc><rect width="390" height="1489.76" fill="#F0F3F9"/><text x="16" y="19" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="start">EVOBASE · policy · STATIC DESIGN / SAMPLE DATA</text><rect x="0" y="28" width="390" height="60" rx="0" fill="#FBFCFF"/><g transform="translate(16 44) scale(.48)"><rect width="64" height="64" rx="22" fill="#3154B8"/><path d="M20 17H45V24H27V29H41V36H27V41H45V48H20Z" fill="#FFFFFF"/><circle cx="47" cy="18" r="4" fill="#C4EFE3"/><path d="M42 20L48 15" stroke="#C4EFE3" stroke-width="3"/></g><text x="57" y="67" font-family="Open Sans" font-size="18" font-weight="600" fill="#1C2638" text-anchor="start">EvoBase</text><rect x="209" y="47" width="83" height="26" rx="13" fill="#DEE5FF"/><text x="221" y="65" font-family="Open Sans" font-size="10" font-weight="600" fill="#142A62" text-anchor="start">Builder</text><rect x="326" y="43" width="44" height="44" rx="18" fill="#C4EFE3"/><text x="348" y="71" font-family="Open Sans" font-size="12" font-weight="600" fill="#003D35" text-anchor="middle">LA</text><text x="16" y="121" font-family="Open Sans" font-size="9" font-weight="600" fill="#536076" text-anchor="start">ORDERS / READ POLICY</text><text x="16" y="159.0" font-family="Open Sans" font-size="27" font-weight="600" fill="#1C2638" text-anchor="start">Ai được xem đơn hàng?</text><text x="16" y="201.56" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Chọn người, điều kiện và kiểm tra bằng tình huống mẫu.</text><rect x="16" y="229.76" width="219.875" height="26" rx="13" fill="#DEE5FF"/><text x="28" y="247.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#142A62" text-anchor="start">Chưa áp dụng cho ứng dụng đã xuất bản</text><rect x="16" y="273.76" width="358" height="70" rx="18" fill="#E1E7F7"/><text x="32" y="298.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#202D49" text-anchor="start">BUILDER · BẢN TÓM TẮT</text><text x="32" y="319.76" font-family="Open Sans" font-size="11" font-weight="400" fill="#202D49" text-anchor="start">Chỉnh cấu trúc trên màn hình rộng. Mobile ưu tiên Runtime.</text><rect x="16" y="359.76" width="358" height="460" rx="24" fill="#FBFCFF"/><text x="38" y="395.76" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Thông tin có kiểu</text><text x="36.0" y="431.76" font-family="Open Sans" font-size="11" font-weight="600" fill="#536076" text-anchor="start">Ai</text><rect x="36.0" y="444.76" width="318.0" height="54" rx="12" fill="#F0F3F9"/><text x="51.0" y="467.76" font-family="Open Sans" font-size="12" font-weight="400" fill="#1C2638" text-anchor="start">Quản lý hoặc người phụ trách</text><text x="36.0" y="525.76" font-family="Open Sans" font-size="11" font-weight="600" fill="#536076" text-anchor="start">Được làm gì</text><rect x="36.0" y="538.76" width="318.0" height="54" rx="12" fill="#F0F3F9"/><text x="51.0" y="561.76" font-family="Open Sans" font-size="12" font-weight="400" fill="#1C2638" text-anchor="start">Xem đơn hàng</text><text x="36.0" y="619.76" font-family="Open Sans" font-size="11" font-weight="600" fill="#536076" text-anchor="start">Điều kiện</text><rect x="36.0" y="632.76" width="318.0" height="54" rx="12" fill="#F0F3F9"/><text x="51.0" y="655.76" font-family="Open Sans" font-size="12" font-weight="400" fill="#1C2638" text-anchor="start">Đơn do chính mình phụ trách</text><text x="36.0" y="713.76" font-family="Open Sans" font-size="11" font-weight="600" fill="#536076" text-anchor="start">Nếu không thỏa điều kiện</text><rect x="36.0" y="726.76" width="318.0" height="54" rx="12" fill="#F0F3F9"/><text x="51.0" y="749.76" font-family="Open Sans" font-size="12" font-weight="400" fill="#1C2638" text-anchor="start">Không cho phép</text><rect x="16.0" y="835.76" width="358.0" height="144" rx="24" fill="#DEE5FF"/><text x="36.0" y="867.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">01</text><text x="36.0" y="897.76" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Linh · Quản lý</text><text x="36.0" y="931.86" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Được xem trong ví dụ</text><text x="36.0" y="955.76" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Quyền tài khoản vẫn cần hợp lệ</text><rect x="16.0" y="995.76" width="358.0" height="144" rx="24" fill="#FBFCFF"/><text x="36.0" y="1027.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">02</text><text x="36.0" y="1057.76" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">An · Đơn An phụ trách</text><text x="36.0" y="1091.86" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Được xem trong ví dụ</text><text x="36.0" y="1115.76" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Chỉ hiện trường được cho phép</text><rect x="16.0" y="1155.76" width="358.0" height="144" rx="24" fill="#FBFCFF"/><text x="36.0" y="1187.76" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">03</text><text x="36.0" y="1217.76" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">An · Đơn Linh phụ trách</text><text x="36.0" y="1251.86" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Không được xem</text><text x="36.0" y="1275.76" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Không mở quyền qua liên kết khách hàng</text><rect x="0" y="1357.76" width="390" height="132" rx="0" fill="#FBFCFF"/><rect x="16" y="1371.76" width="358" height="48" rx="24.0" fill="#3154B8"/><text x="195.0" y="1399.76" font-family="Open Sans" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tiếp tục trên màn hình rộng</text><path d="M0 1432.76L390 1432.76" stroke="#C3CDDD" stroke-width="1" fill="none"/><g transform="translate(38 1444.76) scale(0.8636363636363636)"><path d="M3 10L11 3L19 10V19H3Z" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="49" y="1479.76" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Tổng quan</text><g transform="translate(135 1444.76) scale(0.8636363636363636)"><path d="M3 3H19V19H3ZM3 9H19M9 3V19" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="146" y="1479.76" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Bảng</text><g transform="translate(232 1444.76) scale(0.8636363636363636)"><path d="M4 5H8V9H4ZM14 13H18V17H14ZM8 7H16V13" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="243" y="1479.76" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Cấu trúc</text><g transform="translate(329 1444.76) scale(0.8636363636363636)"><path d="M11 4A7 7 0 1 1 10.9 4M11 8A3 3 0 1 1 10.9 8" fill="none" stroke="#3154B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="340" y="1479.76" font-family="Open Sans" font-size="8" font-weight="600" fill="#3154B8" text-anchor="middle">Khác</text></svg>