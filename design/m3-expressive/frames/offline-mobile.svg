<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1546.96" viewBox="0 0 390 1546.96"><title>Nháp của bạn vẫn được giữ</title><desc>Original static design reference, sample data; not runtime screenshot.</desc><rect width="390" height="1546.96" fill="#F0F3F9"/><text x="16" y="19" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="start">EVOBASE · offline · STATIC DESIGN / SAMPLE DATA</text><rect x="0" y="28" width="390" height="60" rx="0" fill="#FBFCFF"/><g transform="translate(16 44) scale(.48)"><rect width="64" height="64" rx="22" fill="#3154B8"/><path d="M20 17H45V24H27V29H41V36H27V41H45V48H20Z" fill="#FFFFFF"/><circle cx="47" cy="18" r="4" fill="#C4EFE3"/><path d="M42 20L48 15" stroke="#C4EFE3" stroke-width="3"/></g><text x="57" y="67" font-family="Open Sans" font-size="18" font-weight="600" fill="#1C2638" text-anchor="start">EvoBase</text><rect x="209" y="47" width="83" height="26" rx="13" fill="#DEE5FF"/><text x="221" y="65" font-family="Open Sans" font-size="10" font-weight="600" fill="#142A62" text-anchor="start">Runtime</text><rect x="326" y="43" width="44" height="44" rx="18" fill="#C4EFE3"/><text x="348" y="71" font-family="Open Sans" font-size="12" font-weight="600" fill="#003D35" text-anchor="middle">LA</text><text x="16" y="121" font-family="Open Sans" font-size="9" font-weight="600" fill="#536076" text-anchor="start">ĐỒNG BỘ / NGOẠI TUYẾN</text><text x="16" y="159.0" font-family="Open Sans" font-size="27" font-weight="600" fill="#1C2638" text-anchor="start">Nháp của bạn vẫn được giữ</text><text x="16" y="201.56" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Bạn đang mất kết nối. Thay đổi chưa được xác nhận trên máy</text><text x="16" y="220.76" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">chủ.</text><rect x="16" y="248.96" width="200.078125" height="26" rx="13" fill="#DEE5FF"/><text x="28" y="266.96000000000004" font-family="Open Sans" font-size="10" font-weight="600" fill="#142A62" text-anchor="start">Ngoại tuyến · 2 thay đổi chờ đồng bộ</text><rect x="16.0" y="292.96000000000004" width="358.0" height="170" rx="24" fill="#DEE5FF"/><text x="36.0" y="324.96000000000004" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">01</text><text x="36.0" y="354.96000000000004" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Đơn nháp chưa đồng bộ</text><text x="36.0" y="389.06000000000006" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">ORD-local-02 · đang lưu trên thiết bị</text><text x="36.0" y="438.96000000000004" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Chưa gửi đơn hàng</text><rect x="16.0" y="478.96000000000004" width="358.0" height="170" rx="24" fill="#FBFCFF"/><text x="36.0" y="510.96000000000004" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">02</text><text x="36.0" y="540.96" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Thay đổi cần giải quyết</text><text x="36.0" y="575.0600000000001" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Đơn đã được chỉnh ở nơi khác</text><text x="36.0" y="624.96" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Xem hai bản, chọn thay đổi muốn giữ</text><rect x="16.0" y="664.96" width="358.0" height="170" rx="24" fill="#FBFCFF"/><text x="36.0" y="696.96" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">03</text><text x="36.0" y="726.96" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Xuất mẫu ứng dụng</text><text x="36.0" y="761.0600000000001" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Mặc định không kèm dữ liệu riêng</text><text x="36.0" y="810.96" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Tính năng sẽ bật khi kiểm định dạng hoàn tất</text><rect x="16.0" y="850.96" width="358.0" height="170" rx="24" fill="#DEE5FF"/><text x="36.0" y="882.96" font-family="Open Sans" font-size="10" font-weight="600" fill="#3154B8" text-anchor="start">04</text><text x="36.0" y="912.96" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Khôi phục</text><text x="36.0" y="947.0600000000001" font-family="Open Sans" font-size="12" font-weight="400" fill="#536076" text-anchor="start">Kiểm tra bản sao và phạm vi</text><text x="36.0" y="996.96" font-family="Open Sans" font-size="10" font-weight="400" fill="#536076" text-anchor="start">Không tự gửi lại thông báo cũ</text><rect x="16" y="1044.96" width="358" height="328" rx="24" fill="#E9EEF7"/><text x="38" y="1080.96" font-family="Open Sans" font-size="17" font-weight="600" fill="#1C2638" text-anchor="start">Chi tiết &amp; ràng buộc</text><text x="36" y="1120.96" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Kết nối</text><text x="36" y="1145.96" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Ngoại tuyến</text><text x="36" y="1184.96" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Nháp đã giữ</text><text x="36" y="1209.96" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">2 thay đổi</text><text x="36" y="1248.96" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Gửi đơn hàng</text><text x="36" y="1273.96" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Chưa xác nhận</text><text x="36" y="1312.96" font-family="Open Sans" font-size="10" font-weight="600" fill="#536076" text-anchor="start">Tiếp theo</text><text x="36" y="1337.96" font-family="Open Sans" font-size="12" font-weight="600" fill="#1C2638" text-anchor="start">Đăng nhập và kiểm lại khi có mạng</text><rect x="0" y="1414.96" width="390" height="132" rx="0" fill="#FBFCFF"/><rect x="16" y="1428.96" width="358" height="48" rx="24.0" fill="#3154B8"/><text x="195.0" y="1456.96" font-family="Open Sans" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Xem 2 thay đổi chờ đồng bộ</text><path d="M0 1489.96L390 1489.96" stroke="#C3CDDD" stroke-width="1" fill="none"/><g transform="translate(38 1501.96) scale(0.8636363636363636)"><path d="M3 10L11 3L19 10V19H3Z" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="49" y="1536.96" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Đơn hàng</text><g transform="translate(135 1501.96) scale(0.8636363636363636)"><path d="M4 3H18V19H4ZM7 7L9 9L13 5M7 14H15" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="146" y="1536.96" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Công việc</text><g transform="translate(232 1501.96) scale(0.8636363636363636)"><path d="M3 4H19V16H10L5 20V16H3Z" fill="none" stroke="#536076" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="243" y="1536.96" font-family="Open Sans" font-size="8" font-weight="600" fill="#536076" text-anchor="middle">Hộp thư</text><g transform="translate(329 1501.96) scale(0.8636363636363636)"><path d="M11 4A7 7 0 1 1 10.9 4M11 8A3 3 0 1 1 10.9 8" fill="none" stroke="#3154B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="340" y="1536.96" font-family="Open Sans" font-size="8" font-weight="600" fill="#3154B8" text-anchor="middle">Khác</text></svg>